# YOLOv9 GELAN-t smoke cfg for the local LegoGears dataset.
# Source topology: reference_yolov9_repo/yolov9/models/detect/gelan-t.yaml
# Dataset: test_training_set/LegoGears_v2/LegoGears.local.data
# Training gate: ./darknet detector train test_training_set/LegoGears_v2/LegoGears.local.data cfg/gelan-t-legogears.cfg -dont_show -map
#
# This is intentionally the smallest shape-faithful Darknet cfg needed to
# unblock GELAN + DDetect work. RepNCSPELAN4 inner RepNCSP branches are collapsed
# to plain Conv sequences; a generated parity cfg should replace this once the
# converter/mapping tooling is ready.

[net]
# Testing
#batch=1
#subdivisions=1
# Training
batch=8
subdivisions=1
width=224
height=160
channels=3
momentum=0.9
decay=0.0005
angle=0
saturation = 1.5
exposure = 1.5
hue=.1

learning_rate=0.00261
burn_in=1000
max_batches=3000
policy=steps
steps=2400,2700
scales=.1,.1

cutmix=0
flip=0
mixup=0
mosaic=0
use_cuda_graph=0

# 0 - YAML 0-P1/2 Conv [16, 3, 2]
[convolutional]
batch_normalize=1
filters=16
size=3
stride=2
pad=1
activation=swish

